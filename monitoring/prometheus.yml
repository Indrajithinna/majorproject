global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "backend"
    metrics_path: /metrics
    static_configs:
    - targets: ["172.18.0.4:30008"]

  - job_name: "lstm_prediction"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:9001"

  - job_name: "workload_prediction"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:9002"