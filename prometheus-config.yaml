apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "backend"
        static_configs:
          - targets:
              - "mgrk-backend-service.default.svc.cluster.local:8000"

      - job_name: "lstm_prediction"
        static_configs:
          - targets:
              - "host.docker.internal:9001"